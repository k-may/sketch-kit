name: Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install, build, and test
        run: |
          npm ci
          npm run build --if-present
          npm test
          node --test test/*.test.mjs
        env:
          CI: true

  release:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      (startsWith(github.head_ref, 'fix/') || startsWith(github.head_ref, 'feature/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: npm-release-main
      queue: max
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      SOURCE_BRANCH: ${{ github.head_ref }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Resolve release version or resume a previous attempt
        id: version
        shell: bash
        run: |
          set -euo pipefail
          marker="Release-PR: #${PR_NUMBER}"
          previous=$(git log main --format='%H' --grep="^${marker}$" | head -n 1)
          if [[ -n "$previous" ]]; then
            git checkout --detach "$previous"
            version=$(node -p "require('./package.json').version")
            test "$(git rev-list -n 1 "v$version")" = "$previous"
            echo 'resume=true' >> "$GITHUB_OUTPUT"
          else
            git merge-base --is-ancestor "$MERGE_SHA" HEAD
            case "$SOURCE_BRANCH" in
              fix/*) bump=patch ;;
              feature/*) bump=minor ;;
              *) exit 1 ;;
            esac
            npm version "$bump" --no-git-tag-version --ignore-scripts
            version=$(node -p "require('./package.json').version")
            echo 'resume=false' >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install, build, and test release
        run: |
          npm ci
          npm run build --if-present
          npm test
          node --test test/*.test.mjs
        env:
          CI: true
      - name: Commit version and push release tag
        if: steps.version.outputs.resume != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore(release): v${VERSION}" -m "Release-PR: #${PR_NUMBER}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push --atomic origin HEAD:main "refs/tags/v${VERSION}"
      - name: Publish to npm unless this version already exists
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          package=$(node -p "require('./package.json').name")
          if npm view "${package}@${VERSION}" version --json > "$RUNNER_TEMP/npm-version.json" 2> "$RUNNER_TEMP/npm-error.log"; then
            echo "${package}@${VERSION} is already published; skipping."
          elif grep -q 'E404' "$RUNNER_TEMP/npm-error.log"; then
            npm publish --access public
          else
            cat "$RUNNER_TEMP/npm-error.log" >&2
            exit 1
          fi
